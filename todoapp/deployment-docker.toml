[[activity_exec]]
ffqn = "demo:playwright/browser.run"
location = "activity/run.sh"
params = [
  { name = "url", type = "string" },
  { name = "code", type = "string" },
]
return_type = "result<string, string>"
exec.lock_expiry.seconds = 120
max_retries = 2
max_output_bytes = 65536
env_vars = ["PATH"]

# Multi-step browser session for `just *-multistep`: VNC and `just advance` work between steps.
[[activity_exec]]
ffqn = "demo:playwright/browser-session.start"
location = "activity/start.sh"
params = [
  { name = "container-name", type = "string" },
  { name = "socket", type = "string" },
  { name = "url", type = "string" },
]
return_type = "result<record { container: string, image: string, socket: string, id: string, vncport: option<u16> }, string>"
exec.lock_expiry.seconds = 45
max_retries = 3
env_vars = [
  "PATH",
  { key = "HEADED", value = "${HEADED:-true}" },
]

[[activity_exec]]
ffqn = "demo:playwright/browser-session.eval"
location = "activity/eval.sh"
params = [
  { name = "socket", type = "string" },
  { name = "code", type = "string" },
]
return_type = "result<string, string>"
exec.lock_expiry.seconds = 45
max_retries = 2
max_output_bytes = 65536
env_vars = ["PATH"]

[[activity_exec]]
ffqn = "demo:playwright/browser-session.cleanup"
location = "activity/cleanup.sh"
params = [
  { name = "container-name", type = "string" },
  { name = "socket", type = "string" },
]
return_type = "result<_, string>"
exec.lock_expiry.seconds = 30
max_retries = 3
env_vars = ["PATH"]

[[workflow_js]]
ffqn = "demo:playwright/todoapp.run"
location = "workflow/run.js"
params = [{ name = "task", type = "string" }]
return_type = "result<record { title: string, tasks: list<string> }, string>"

[[workflow_js]]
ffqn = "demo:playwright/todoapp-multistep.run"
location = "workflow/multistep.js"
params = [
  { name = "session-id", type = "string" },
  { name = "task", type = "string" },
  { name = "pause-seconds", type = "u32" },
]
return_type = "result<record { title: string, tasks: list<string> }, string>"
